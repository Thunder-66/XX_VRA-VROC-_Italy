<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #151412;
    --panel: #1D1B18;
    --line: #38352F;
    --ink: #EDE7DC;
    --ink-dim: #9C9488;
    --amber: #E8871E;
  }
  * { box-sizing: border-box; }
  html{ font-size: 19px; }
  body{
    margin: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    padding: 3.5rem 1.5rem 4rem;
  }
  header{
    max-width: 780px;
    margin: 0 auto 3rem;
    text-align: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2rem;
  }
  header h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 7vw, 4.6rem);
    letter-spacing: 0.03em;
    margin: 0 0 0.6rem;
  }
  header h1 span{ color: var(--amber); }
  header p{
    color: var(--ink-dim);
    font-size: 1.3rem;
    margin: 0;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }
  .grid{
    max-width: 1140px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.6rem;
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: 1fr; }
  }
  .card{
    position: relative;
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .card:hover, .card:focus-visible{
    border-color: var(--amber);
    transform: translateY(-3px);
  }
  .card:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .thumb{
    width: 100%;
    aspect-ratio: 4 / 3;
    background-size: cover;
    background-position: center;
    position: relative;
    background-color: #2A2622;
  }
  .thumb::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.05) 55%);
  }
  .label{
    position: absolute;
    left: 1rem;
    bottom: 0.8rem;
    z-index: 1;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.03em;
    color: var(--ink);
  }
  .card.disabled{
    cursor: default;
    opacity: 0.78;
  }
  .card.disabled:hover,
  .card.disabled:focus-visible{
    border-color: var(--line);
    transform: none;
    outline: none;
  }
  .badge-soon{
    position: absolute;
    top: 0.7rem;
    right: 0.7rem;
    z-index: 1;
    background: rgba(0,0,0,0.72);
    color: var(--amber);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.22rem 0.55rem;
    border: 1px solid var(--amber);
    border-radius: 2px;
  }
  footer{
    max-width: 780px;
    margin: 3.5rem auto 0;
    text-align: center;
    color: var(--ink-dim);
    font-size: 1.15rem;
    border-top: 1px solid var(--line);
    padding-top: 1.5rem;
  }
</style>
</head>
